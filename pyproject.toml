[project]
name = "omni"
version = "0.1.0"
description = "OMNI desktop orchestration prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "numpy>=1.26",
  "requests>=2.31",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4", "faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8"]

[project.scripts]
omnid = "omni.main:daemon_entry"
omni = "omni.main:main"
omni-ui = "omni.native.app:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["omni", "omni.*", "bench", "bench.*"]
