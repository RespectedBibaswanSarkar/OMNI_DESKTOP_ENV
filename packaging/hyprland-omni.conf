# --- OMNI (source this from hyprland.conf, e.g.  source = ~/.config/hypr/omni.conf) ---
# 1) give systemd --user services the compositor environment (hyprctl needs the signature)
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_RUNTIME_DIR
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# 2) start the daemon and the (hidden) panel
exec-once = systemctl --user start omnid
exec-once = omni-ui --hidden
# 3) global hotkey: show/hide the panel
bind = SUPER, SPACE, exec, omni-ui --toggle
# 4) behave like a launcher panel: floating, centred, no border/animation clutter
windowrulev2 = float, class:^(omni)$
windowrulev2 = center, class:^(omni)$
windowrulev2 = size 640 380, class:^(omni)$
windowrulev2 = stayfocused, class:^(omni)$
windowrulev2 = noborder, class:^(omni)$
windowrulev2 = pin, class:^(omni)$
