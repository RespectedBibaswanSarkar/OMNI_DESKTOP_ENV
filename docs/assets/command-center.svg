<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="640" fill="#0d1014"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="650" fill="#e8ecf1">AI Command Center — Conceptual Wireframe</text>
  <text x="600" y="54" text-anchor="middle" font-size="11" fill="#5d6875">explanatory mockup · stage chips reflect real pipeline events</text>

  <g transform="translate(90,84)">
    <rect width="1020" height="500" rx="16" fill="#12161c" stroke="#2a323c"/>
    <rect x="1" y="1" width="1018" height="40" rx="15" fill="#141a21"/>
    <text x="20" y="26" font-size="12" font-weight="600" fill="#e8ecf1">AI Command Center</text>
    <rect x="800" y="10" width="100" height="22" rx="11" fill="#182028" stroke="#6ea8ff" stroke-opacity="0.4"/>
    <text x="850" y="25" text-anchor="middle" font-size="10" fill="#6ea8ff">inferring…</text>

    <!-- goal input -->
    <rect x="20" y="56" width="680" height="76" rx="10" fill="#141a21" stroke="#2a323c"/>
    <text x="34" y="82" font-size="11.5" fill="#9aa7b4">Analyse my research project and organize its next milestones.</text>
    <rect x="720" y="70" width="120" height="30" rx="8" fill="#5ee6c5"/>
    <text x="780" y="90" text-anchor="middle" font-size="11" fill="#0d1014" font-weight="600">Submit task</text>
    <text x="34" y="118" font-size="9.5" fill="#5d6875">runs in an isolated sandbox · IARS → AMPL → model → KRLS → execute → verify → reward</text>

    <!-- pipeline stages -->
    <g transform="translate(20,150)">
      <rect width="420" height="330" rx="10" fill="#141a21" stroke="#2a323c"/>
      <text x="14" y="24" font-size="10.5" fill="#9aa7b4" letter-spacing="1">PIPELINE</text>
      <g font-size="10.5">
        <rect x="12" y="36" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="49" r="4" fill="#5ee6c5"/><text x="40" y="53" fill="#c7d0da">context</text><text x="398" y="53" text-anchor="end" fill="#5ee6c5">done</text>
        <rect x="12" y="66" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="79" r="4" fill="#5ee6c5"/><text x="40" y="83" fill="#c7d0da">iars</text><text x="398" y="83" text-anchor="end" fill="#5ee6c5">planner · 0.71</text>
        <rect x="12" y="96" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="109" r="4" fill="#5ee6c5"/><text x="40" y="113" fill="#c7d0da">ampl</text><text x="398" y="113" text-anchor="end" fill="#5ee6c5">3 modules</text>
        <rect x="12" y="126" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="139" r="4" fill="#5ee6c5"/><text x="40" y="143" fill="#c7d0da">model</text><text x="398" y="143" text-anchor="end" fill="#5ee6c5">qwen3:4b</text>
        <rect x="12" y="156" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="169" r="4" fill="#ffb454"/><text x="40" y="173" fill="#c7d0da">scheduler</text><text x="398" y="173" text-anchor="end" fill="#ffb454">boost · dry-run</text>
        <rect x="12" y="186" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="199" r="4" fill="#6ea8ff"/><text x="40" y="203" fill="#c7d0da">generation</text><text x="398" y="203" text-anchor="end" fill="#6ea8ff">structured JSON</text>
        <rect x="12" y="216" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="229" r="4" fill="#6ea8ff"/><text x="40" y="233" fill="#c7d0da">execution</text><text x="398" y="233" text-anchor="end" fill="#6ea8ff">3/3 actions</text>
        <rect x="12" y="246" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="259" r="4" fill="#5ee6c5"/><text x="40" y="263" fill="#c7d0da">verification</text><text x="398" y="263" text-anchor="end" fill="#5ee6c5">5/5 passed</text>
        <rect x="12" y="276" width="396" height="26" rx="6" fill="#1b212a"/><circle cx="26" cy="289" r="4" fill="#5ee6c5"/><text x="40" y="293" fill="#c7d0da">reward</text><text x="398" y="293" text-anchor="end" fill="#5ee6c5">+1.20</text>
        <rect x="12" y="306" width="396" height="20" rx="6" fill="#1b212a"/><circle cx="26" cy="316" r="4" fill="#5ee6c5"/><text x="40" y="320" fill="#c7d0da">adaptive-update</text><text x="398" y="320" text-anchor="end" fill="#5ee6c5">IARS 6 · KRLS 4</text>
      </g>
    </g>

    <!-- result -->
    <g transform="translate(460,150)">
      <rect width="540" height="330" rx="10" fill="#141a21" stroke="#2a323c"/>
      <text x="14" y="24" font-size="10.5" fill="#9aa7b4" letter-spacing="1">RESULT</text>
      <g font-family="monospace" font-size="10" fill="#9aa7b4">
        <text x="14" y="48">Executed 3/3 planned actions in workspace/isolated/6f63…</text>
        <text x="14" y="68">  [OK ] mkdir research_plan — created research_plan</text>
        <text x="14" y="88">  [OK ] write_file NOTES.md — wrote 214 chars</text>
        <text x="14" y="108">  [OK ] write_json plan.json — valid JSON</text>
        <text x="14" y="128">Verification: 5/5 checks passed.</text>
      </g>
      <text x="14" y="160" font-size="10.5" fill="#9aa7b4" letter-spacing="1">REWARD &amp; ADAPTATION</text>
      <g font-size="10" fill="#9aa7b4">
        <text x="14" y="184">reward</text><text x="110" y="184" fill="#5ee6c5">+1.1997 (verification + implicit terms)</text>
        <text x="14" y="206">IARS</text><text x="110" y="206" fill="#c7d0da">posterior updated with observed outcome</text>
        <text x="14" y="228">KRLS</text><text x="110" y="228" fill="#c7d0da">action 'boost' received task reward</text>
        <text x="14" y="250">policy</text><text x="110" y="250" fill="#c7d0da">heuristic-prior → krls after first rewards</text>
      </g>
      <text x="14" y="286" font-size="10.5" fill="#9aa7b4" letter-spacing="1">VERIFICATION CHECKS</text>
      <g font-size="9.5" fill="#9aa7b4">
        <text x="14" y="308">NOTES.md · file_exists</text><text x="250" y="308" fill="#5ee6c5">pass</text>
        <text x="14" y="326">plan.json · valid_json</text><text x="250" y="326" fill="#5ee6c5">pass</text>
      </g>
    </g>
  </g>
</svg>
