<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="700" fill="#0d1014"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="650" fill="#e8ecf1">OMNI Desktop — Conceptual Wireframe</text>
  <text x="600" y="54" text-anchor="middle" font-size="11" fill="#5d6875">explanatory mockup · the implemented dashboard follows this information hierarchy</text>

  <!-- HUD overlay -->
  <g transform="translate(60,80)">
    <rect width="260" height="120" rx="12" fill="#12161c" stroke="#5ee6c5" stroke-opacity="0.45"/>
    <text x="16" y="26" font-size="11" fill="#5ee6c5" letter-spacing="1.5">QUICKSHELL HUD (operational)</text>
    <text x="16" y="48" font-size="11.5" fill="#e8ecf1">agent: planner · conf 0.71</text>
    <text x="16" y="68" font-size="11.5" fill="#9aa7b4">modules: 3 resident · 96 MB</text>
    <text x="16" y="88" font-size="11.5" fill="#ffb454">sched: boost (dry-run)</text>
    <text x="16" y="108" font-size="10" fill="#5d6875">reads hud/state.json</text>
  </g>

  <!-- main window -->
  <g transform="translate(370,80)">
    <rect width="770" height="540" rx="16" fill="#12161c" stroke="#2a323c"/>
    <!-- topbar -->
    <rect x="1" y="1" width="768" height="44" rx="15" fill="#141a21"/>
    <circle cx="28" cy="23" r="7" fill="#5ee6c5"/>
    <text x="46" y="28" font-size="13" font-weight="600" fill="#e8ecf1">OMNI</text>
    <rect x="520" y="12" width="90" height="22" rx="11" fill="#182028" stroke="#5ee6c5" stroke-opacity="0.4"/>
    <text x="565" y="27" text-anchor="middle" font-size="10" fill="#5ee6c5">Ollama · 8</text>
    <rect x="620" y="12" width="60" height="22" rx="11" fill="#182028" stroke="#2a323c"/>
    <text x="650" y="27" text-anchor="middle" font-size="10" fill="#9aa7b4">qwen3:4b</text>
    <rect x="690" y="12" width="64" height="22" rx="11" fill="#182028" stroke="#2a323c"/>
    <text x="722" y="27" text-anchor="middle" font-size="10" fill="#9aa7b4">idle</text>
    <!-- sidebar -->
    <g font-size="11.5" fill="#9aa7b4">
      <rect x="12" y="60" width="150" height="480" rx="10" fill="#141a21"/>
      <rect x="22" y="72" width="130" height="30" rx="8" fill="#5ee6c5" fill-opacity="0.12"/>
      <text x="36" y="92" fill="#5ee6c5">◉ Home</text>
      <text x="36" y="126">⌘ Command</text>
      <text x="36" y="152">◈ Algorithms</text>
      <text x="36" y="178">▣ Models</text>
      <text x="36" y="204">◔ Monitor</text>
      <text x="36" y="230">◷ History</text>
      <text x="36" y="256">⚙ Settings</text>
      <rect x="22" y="490" width="130" height="22" rx="11" fill="#182028"/>
      <text x="87" y="505" text-anchor="middle" font-size="9.5" fill="#9aa7b4">local-only · v0.4</text>
    </g>
    <!-- home content -->
    <g transform="translate(180,72)">
      <rect width="570" height="96" rx="10" fill="#182028" stroke="#2a323c"/>
      <text x="18" y="28" font-size="14" font-weight="600" fill="#e8ecf1">Good day, operator.</text>
      <text x="18" y="48" font-size="10.5" fill="#9aa7b4">IARS → AMPL → local model → KRLS → verify → reward, entirely on this machine.</text>
      <rect x="18" y="60" width="200" height="24" rx="7" fill="#5ee6c5"/>
      <text x="118" y="76" text-anchor="middle" font-size="10" fill="#0d1014" font-weight="600">Run research demo</text>
      <rect x="228" y="60" width="170" height="24" rx="7" fill="#20262e"/>
      <text x="313" y="76" text-anchor="middle" font-size="10" fill="#e8ecf1">Create sample project</text>
    </g>
    <g transform="translate(180,182)" font-size="10.5">
      <rect width="132" height="76" rx="10" fill="#182028" stroke="#2a323c"/>
      <text x="12" y="20" fill="#5d6875">Active model</text><text x="12" y="42" font-size="13" fill="#e8ecf1">qwen3:4b</text><text x="12" y="60" font-size="9" fill="#5d6875">8 discovered</text>
      <rect x="146" width="132" height="76" rx="10" fill="#182028" stroke="#2a323c"/>
      <text x="158" y="20" fill="#5d6875">Inference</text><text x="158" y="42" font-size="13" fill="#5ee6c5">online</text><text x="158" y="60" font-size="9" fill="#5d6875">127.0.0.1:11434</text>
      <rect x="292" width="132" height="76" rx="10" fill="#182028" stroke="#2a323c"/>
      <text x="304" y="20" fill="#5d6875">Workload</text><text x="304" y="42" font-size="13" fill="#e8ecf1">0 / 0</text><text x="304" y="60" font-size="9" fill="#5d6875">running / queued</text>
      <rect x="438" width="132" height="76" rx="10" fill="#182028" stroke="#2a323c"/>
      <text x="450" y="20" fill="#5d6875">Tasks</text><text x="450" y="42" font-size="13" fill="#e8ecf1">14</text><text x="450" y="60" font-size="9" fill="#5d6875">12 verified</text>
    </g>
    <g transform="translate(180,278)">
      <rect width="276" height="242" rx="10" fill="#182028" stroke="#2a323c"/>
      <text x="14" y="24" font-size="10.5" fill="#9aa7b4" letter-spacing="1">SYSTEM (real /proc + nvidia-smi)</text>
      <g font-size="10" fill="#9aa7b4">
        <text x="14" y="52">CPU load</text><rect x="110" y="42" width="150" height="7" rx="3.5" fill="#232a32"/><rect x="110" y="42" width="45" height="7" rx="3.5" fill="#5ee6c5"/>
        <text x="14" y="82">Memory</text><rect x="110" y="72" width="150" height="7" rx="3.5" fill="#232a32"/><rect x="110" y="72" width="96" height="7" rx="3.5" fill="#5ee6c5"/>
        <text x="14" y="112">GPU VRAM</text><rect x="110" y="102" width="150" height="7" rx="3.5" fill="#232a32"/><rect x="110" y="102" width="70" height="7" rx="3.5" fill="#6ea8ff"/>
        <text x="14" y="142">Disk</text><rect x="110" y="132" width="150" height="7" rx="3.5" fill="#232a32"/><rect x="110" y="132" width="58" height="7" rx="3.5" fill="#ffb454"/>
      </g>
      <text x="14" y="176" font-size="9.5" fill="#5d6875">missing sources render “unavailable” — never fabricated</text>
    </g>
    <g transform="translate(474,278)">
      <rect width="276" height="242" rx="10" fill="#182028" stroke="#2a323c"/>
      <text x="14" y="24" font-size="10.5" fill="#9aa7b4" letter-spacing="1">RECENT TASKS</text>
      <g font-size="10">
        <rect x="10" y="38" width="252" height="30" rx="7" fill="#1b212a"/><text x="20" y="57" fill="#c7d0da">research milestones…</text><text x="248" y="57" text-anchor="end" fill="#5ee6c5">done</text>
        <rect x="10" y="74" width="252" height="30" rx="7" fill="#1b212a"/><text x="20" y="93" fill="#c7d0da">literature notes…</text><text x="248" y="93" text-anchor="end" fill="#5ee6c5">done</text>
        <rect x="10" y="110" width="252" height="30" rx="7" fill="#1b212a"/><text x="20" y="129" fill="#c7d0da">python project…</text><text x="248" y="129" text-anchor="end" fill="#ffb454">running</text>
      </g>
      <text x="14" y="170" font-size="10.5" fill="#9aa7b4" letter-spacing="1">DESKTOP ACTIONS</text>
      <g font-size="9.5" fill="#9aa7b4">
        <text x="14" y="192">app.launch · confirm tier</text>
        <text x="14" y="210">workspace.switch · confirm tier</text>
        <text x="14" y="228">file.search · read-only</text>
      </g>
    </g>
  </g>
</svg>
