<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141a"/>
      <stop offset="0.55" stop-color="#12161c"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee6c5"/>
      <stop offset="1" stop-color="#6ea8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.9">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.8">
      <stop offset="0" stop-color="#5ee6c5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5ee6c5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>

  <g transform="translate(64,54)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#accent)"/>
    <circle cx="26" cy="26" r="9" fill="#0d1014"/>
    <circle cx="26" cy="26" r="4.5" fill="#5ee6c5"/>
    <text x="72" y="30" font-size="34" font-weight="700" fill="#e8ecf1" letter-spacing="6">OMNI</text>
    <text x="72" y="52" font-size="13" fill="#9aa7b4" letter-spacing="2.5">AN ADAPTIVE, CONTEXT-AWARE AI DESKTOP ENVIRONMENT</text>
  </g>

  <g transform="translate(66,140)">
    <text x="0" y="0" font-size="15.5" fill="#c7d0da">
      <tspan x="0" dy="0">OMNI unifies desktop context awareness, intent routing, module selection, local LLM inference,</tspan>
      <tspan x="0" dy="24">and kernel-level adaptive scheduling into one research system — running entirely on your machine.</tspan>
    </text>
  </g>

  <!-- pipeline strip -->
  <g transform="translate(66,226)" font-size="11.5">
    <g>
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#182028" stroke="#2a323c"/>
      <text x="75" y="21" text-anchor="middle" fill="#e8ecf1">Desktop context</text>
    </g>
    <path d="M150 17 h18" stroke="#3a4450" stroke-width="1.4"/>
    <g>
      <rect x="168" y="0" width="120" height="34" rx="8" fill="#182028" stroke="#5ee6c5" stroke-opacity="0.55"/>
      <text x="228" y="21" text-anchor="middle" fill="#5ee6c5">IARS routing</text>
    </g>
    <path d="M288 17 h18" stroke="#3a4450" stroke-width="1.4"/>
    <g>
      <rect x="306" y="0" width="126" height="34" rx="8" fill="#182028" stroke="#5ee6c5" stroke-opacity="0.55"/>
      <text x="369" y="21" text-anchor="middle" fill="#5ee6c5">AMPL modules</text>
    </g>
    <path d="M432 17 h18" stroke="#3a4450" stroke-width="1.4"/>
    <g>
      <rect x="450" y="0" width="150" height="34" rx="8" fill="#182028" stroke="#6ea8ff" stroke-opacity="0.55"/>
      <text x="525" y="21" text-anchor="middle" fill="#6ea8ff">Local model (Ollama)</text>
    </g>
    <path d="M600 17 h18" stroke="#3a4450" stroke-width="1.4"/>
    <g>
      <rect x="618" y="0" width="126" height="34" rx="8" fill="#182028" stroke="#ffb454" stroke-opacity="0.55"/>
      <text x="681" y="21" text-anchor="middle" fill="#ffb454">KRLS scheduler</text>
    </g>
    <path d="M744 17 h18" stroke="#3a4450" stroke-width="1.4"/>
    <g>
      <rect x="762" y="0" width="130" height="34" rx="8" fill="#182028" stroke="#2a323c"/>
      <text x="827" y="21" text-anchor="middle" fill="#e8ecf1">Execute + verify</text>
    </g>
    <path d="M892 17 h18" stroke="#3a4450" stroke-width="1.4"/>
    <g>
      <rect x="910" y="0" width="108" height="34" rx="8" fill="#182028" stroke="#5ee6c5" stroke-opacity="0.35"/>
      <text x="964" y="21" text-anchor="middle" fill="#5ee6c5">Reward update</text>
    </g>
  </g>

  <text x="66" y="308" font-size="11" fill="#5d6875">Offline-capable · privacy-preserving · verification-gated execution · research prototype</text>
</svg>
